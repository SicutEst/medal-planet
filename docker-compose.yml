services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: medal-planet-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-medal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medal123}
      POSTGRES_DB: ${DB_NAME:-medal_planet}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medal-planet-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Shanghai
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medal_planet}
      DB_USER: ${DB_USER:-medal}
      DB_PASSWORD: ${DB_PASSWORD:-medal123}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # 前端 H5（nginx 同源反代 /api 到 server）
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: medal-planet-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
