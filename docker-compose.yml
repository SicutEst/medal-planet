version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: medal-planet-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-medal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medal123}
      POSTGRES_DB: medal_planet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medal-planet-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medal_planet}
      DB_USER: ${DB_USER:-medal}
      DB_PASSWORD: ${DB_PASSWORD:-medal123}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src

  # 前端 H5
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: medal-planet-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data:
